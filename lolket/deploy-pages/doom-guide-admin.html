<script>
var U = function () { return window.GUIDE_UTIL; };
window.GUIDE = {
  id: 'admin',
  title: '멸망전 운영자 가이드',
  sub: '관리자 · 운영진용 — 실제 멸망전 화면을 직접 눌러 보며 배워요',
  intro: '오른쪽 화면은 실제 멸망전 페이지와 똑같이 움직이는 체험 화면이에요. 여기서 누르거나 저장한 건 실제 데이터와 디스코드에 전혀 반영되지 않아요.',
  other: { label: '참가자 가이드 →', href: 'doom-guide' },
  doomHref: 'doom',
  chapters: [
    { id: 'create', title: '멸망전 만들기', desc: '이름 · 기간 · 디스코드 연결', who: '관리자', role: 'admin', seed: 'empty', start: '/',
      intro: '새 멸망전을 열고, 스크림에 쓸 디스코드 역할과 채널을 연결해요.',
      outro: '멸망전이 열렸어요. 이제 팀장들이 팀을 신청하면 "팀" 탭에 수락 대기로 올라와요.',
      steps: [
        { t: '멸망전 페이지로 들어와요', d: 'stats 페이지 오른쪽 위 금색 "멸망전" 버튼으로 들어와요 (모바일은 ☰ 메뉴 → 멸망전).\n룽잉닷컴에서 관리자로 로그인한 브라우저면 오른쪽 위에 ADMIN 표시가 떠요. 이 표시가 있어야 만들기 · 수락 · 설정을 할 수 있어요.', act: [['focus', '.chip.admin']] },
        { t: '"멸망전 만들기"를 눌러요', d: '관리자에게만 보이는 버튼이에요.', act: [['click', 'text:멸망전 만들기']] },
        { t: '이름을 적어요', d: '목록과 디스코드 알림에 이 이름이 나와요.', act: [['type', '#ed-name', '겨울 멸망전']] },
        { t: '기간을 정해요', d: '시작일 · 종료일은 목록 카드와 상단에 표시돼요. 비워 둬도 괜찮아요.', act: [['type', '#ed-s', function () { return U().date(6); }], ['type', '#ed-e', function () { return U().date(36); }]] },
        { t: '상태를 골라요', d: '준비 중 → 팀 모집 → 진행 중 → 종료 순서로 바꿔 가며 써요.\n"종료"로 바꾸면 팀 신청 · 수정이 막혀요.', act: [['click', '#ed-st button[data-v="open"]']] },
        { t: '스크림 개설 역할을 골라요', d: '디스코드 서버에 있는 역할 목록이 그대로 나와요.\n여기서 고른 역할을 가진 팀장만 스크림을 열고, 팀 단위로 스크림을 신청할 수 있어요. (역할 + 수락된 팀의 팀장, 두 가지 다 필요해요)', act: [['click', 'text:@팀장']] },
        { t: '디스코드 채널을 연결해요', d: '스크림 포럼 채널: 스크림을 열면 여기에 포스트가 자동으로 올라가요.\n성사 비공개 스레드 채널(텍스트): 스크림이 성사되면 양 팀만 초대된 비공개 스레드를 만들어요. 봇에 "비공개 스레드 만들기" 권한이 필요해요.', act: [['select', '#ed-ch', 'c1'], ['select', '#ed-mch', 't1']] },
        { t: '설명을 적어요', d: '참가 조건, 점수 제한, 일정 같은 걸 적어 두면 상세 화면 위에 그대로 보여요.', act: [['type', '#ed-desc', '12월 한 달 동안 진행해요.\n팀 합계 200점 이하 · 매주 토요일 본선']] },

      outro: '수락하면 팀이 확정되고 팀장에게 DM이 가요. 수락된 팀은 관리자만 고칠 수 있어요.',
      steps: [
        { t: '수락 대기 팀', d: '관리자 화면에서는 수락 대기 팀이 맨 위에 점선 카드로 나와요. 팀 이름 · 팀장 · 라인별 멤버 · 티어 · 점수 · 합계를 한눈에 볼 수 있어요.\n디스코드 아이콘이 있는 멤버는 디스코드 연동된 사람이에요.', act: [['focus', '.roster.pending']] },
        { t: '신청 메모 읽기', d: '팀장이 "잘못된 티어 · 점수, 어드밴티지 점수 계산 정보, 특이사항"을 적어 보낸 메모예요. 관리자와 그 팀 팀장만 볼 수 있어요.', act: [['focus', '.roster.pending@0 >> .memo']] },

        { t: '티어 보정', d: '라인마다 "티어 보정"에서 티어와 단계를 고르면 커뮤니티 점수표대로 점수가 다시 계산돼요. 원래 점수는 취소선으로 같이 보여요.\n예: 정글 새벽별을 다이아몬드 I로 보정', act: [['select', '.slotw@1 >> select@0', 'DIAMOND'], ['select', '.slotw@1 >> select.lp', '1']], focus: '.slotw@1' },

        { t: '수락', d: '"수락"을 누르면 확인 창에 메모가 한 번 더 나와요. 수락하면 팀장에게 디스코드 DM이 가요 (오른쪽 디스코드 화면).', act: [['click', '.roster.pending@0 >> text:수락'], ['wait', 900], ['click', '#rv-go'], ['dfocus', 'DC:dm']] },
        { t: '거절 (사유 포함)', d: '"거절"은 사유를 적어서 보내요. 사유가 팀장에게 DM으로 가고, 팀장은 팀을 고쳐서 다시 신청할 수 있어요.', act: [['click', '.roster.pending@0 >> text:거절'], ['type', '#rv-reason', '팀 합계가 200점을 넘어요. 한 명을 바꿔서 다시 신청해 주세요.'], ['click', '#rv-go'], ['dfocus', 'DC:dm']] },
        { t: '삭제 · 직접 만들기', d: '카드 왼쪽 아래 "삭제"로 신청이나 팀을 바로 지울 수 있어요.\n"팀 만들기"로 관리자가 직접 만든 팀은 바로 확정돼요. 다만 팀장이 "관리자"로 들어가서, 그 팀은 스크림을 열 수 없어요. 스크림을 쓸 팀은 팀장이 직접 신청하게 해 주세요.', act: [['focus', '.rfoot .del@0'], ['wait', 1400], ['focus', 'text:팀 만들기']] },
      ] },
    { id: 'settings', title: '설정 바꾸기', desc: '상태 · 역할 · 채널', who: '관리자', role: 'admin', seed: 'teams', start: '/d/d1/settings',
      intro: '진행 상황에 맞게 상태를 바꾸고, 디스코드 역할과 채널을 고쳐요.',
      outro: '설정은 저장하는 순간 바로 적용돼요.',
      steps: [
        { t: '설정 탭', d: '관리자에게만 보이는 탭이에요. 왼쪽은 기본 정보, 오른쪽은 디스코드 연결이에요.', act: [['focus', '.sgrid']] },
        { t: '상태를 "진행 중"으로', d: '본선이 시작되면 진행 중으로 바꿔요. 목록에 빨간 점이 깜빡이는 LIVE 표시가 떠요.', act: [['click', '#ed-st button[data-v="running"]']] },
        { t: '스크림 개설 역할', d: '고른 역할은 금색으로 바뀌어요. 여러 개를 고를 수 있어요.\n팀장이 "스크림 권한이 안 생겨요"라고 하면: ① 디스코드에서 그 역할을 받았는지 ② 그 팀이 수락됐는지 ③ 팀장으로 등록돼 있는지 확인해 주세요.', act: [['focus', '#ed-roles']] },
        { t: '채널', d: '스크림 포럼 채널과 성사 스레드 채널을 바꿀 수 있어요. 이미 올라간 포스트는 그대로 있어요.', act: [['focus', '#ed-ch'], ['wait', 900], ['focus', '#ed-mch']] },
        { t: '최종 출전 확정 주의사항 · 조건', d: '팀장이 "최종 출전 확정"을 누르면 이 글이 팝업으로 그대로 나와요. 팀장은 "네 동의합니다"에 체크해야 요청할 수 있어요.\n참가비, 입금 기한, 팀원 변경 제한, 지각 · 실격 규칙처럼 출전 전에 꼭 알아야 할 걸 적어 두세요.', act: [['type', '#ed-terms', '1. 참가비 1만 원을 본선 전날까지 입금해 주세요.\n2. 최종 출전이 확정되면 팀원을 바꿀 수 없어요.\n3. 본선 당일 10분 이상 지각하면 몰수패예요.']] },
        { t: '저장', d: '', act: [['click', '#ed-save']] },
        { t: '멸망전 삭제', d: '멸망전을 지우면 팀 정보도 모두 지워지고 되돌릴 수 없어요.', act: [['focus', 'text:멸망전 삭제']] },
      ] },
    { id: 'entry', title: '최종 출전 확정 승인', desc: '참가비 · 내부 심사 통과 팀 확정', who: '관리자', role: 'admin', seed: 'entry', start: '/d/d1',
      intro: '수락된 팀 중 참가비 납부나 내부 심사 기준을 통과한 팀을 "최종 출전 확정" 상태로 만들어요. 팀 수락과는 별개 단계예요.',
      outro: '최종 출전 확정 팀은 팀 목록 맨 앞에 금색으로 빛나는 카드로 나와요. 승인 · 반려 모두 팀장에게 DM이 가요.',
      steps: [
        { t: '출전 확정 요청 팀', d: '팀장이 주의사항에 동의하고 "최종 출전 확정"을 요청하면, 팀 카드에 "최종 출전 확정 요청 중" 표시가 붙어요. 관리자와 그 팀 팀장만 볼 수 있어요.', act: [['focus', '.etag.req@0']] },
        { t: '🏆 출전 승인', d: '참가비 입금이나 심사 통과를 확인했으면 "출전 승인"을 눌러요. 승인하면 팀장에게 디스코드 DM이 가요.', act: [['click', '.entrybtn@0'], ['dfocus', 'DC:dm']] },
        { t: '맨 앞 · 강조 표시', d: '최종 출전 확정 팀은 팀 목록 맨 앞으로 올라오고, 금색 테두리 · 빛 효과 · "🏆 최종 출전 확정" 리본이 붙어요. 모든 사람에게 보여요.', act: [['focus', '.entry-wrap']] },
        { t: '출전 반려 (사유 포함)', d: '조건이 안 맞으면 "출전 반려"를 눌러 사유를 적어 보내요. 사유가 팀장에게 DM으로 가고, 팀장은 조건을 갖춘 뒤 다시 요청할 수 있어요. 팀 수락 상태는 그대로예요.', act: [['click', 'text:출전 반려'], ['type', '#en-reason', '참가비 입금이 아직 확인되지 않았어요.'], ['click', '#en-rv'], ['dfocus', 'DC:dm']] },
        { t: '출전 확정 취소', d: '확정된 팀은 "출전 확정 취소"로 되돌릴 수 있어요. 취소하면 일반 수락 팀으로 돌아가요.', act: [['focus', 'text:출전 확정 취소']] },
      ] },
    { id: 'scrims', title: '스크림 관리', desc: '목록 · 디스코드 포스트 · 삭제', who: '관리자', role: 'admin', seed: 'scrims', start: '/d/d1/scrims', posts: true,
      intro: '스크림은 팀장들이 직접 열고 매칭해요. 관리자는 현황을 보고, 필요하면 대신 열거나 지울 수 있어요.',
      outro: '스크림을 여는 방법과 신청 · 성사 과정은 참가자 가이드에서 자세히 볼 수 있어요.',
      steps: [
        { t: '스크림 목록', d: '모집 중 / 모집 마감 / 성사 상태, 시작 시간, 우리 팀 vs 상대 팀(또는 "상대 모집 중"), 상대 점수 조건이 카드에 나와요.', act: [['focus', '.scgrid']] },
        { t: '디스코드 포스트', d: '스크림이 열리면 스크림 포럼 채널에 이런 포스트가 자동으로 올라가요. 신청이 들어오거나 취소될 때마다 신청 현황이 자동으로 바뀌어요.', act: [['dfocus', 'DC:post:s1']] },
        { t: '스크림 상세', d: '위에는 스크림 정보, 가운데는 VS 화면, 아래는 팀 신청과 라인별 개인 신청 목록이에요.', act: [['click', '.scard@0']], focus: '.vsb' },
        { t: '관리자 삭제', d: '스크림 삭제는 관리자만 할 수 있어요 (스크림을 연 팀장도 못 지워요). 지우면 디스코드 포스트와 스크림 방도 같이 지워져요.', act: [['focus', '.shead >> text:삭제']] },
        { t: '관리자가 대신 열기', d: '관리자는 "스크림 만들기"에서 수락된 팀 중 하나를 골라 그 팀 이름으로 스크림을 열 수 있어요.', act: [['hash', '#/d/d1/scrims'], ['click', 'text:스크림 만들기'], ['focus', '#sf-team']] },
      ] },
  ],
};
