<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080C">
<title>멸망전 · 룽잉닷컴</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,600;125,700;125,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme:dark;
  --bg:#06080C;--bg2:#0B0F16;--panel:#0F141C;--panel2:#141A24;--line:#1C2430;--line2:#283242;
  --text:#ECEFF4;--muted:#8A94A6;--dim:#566072;
  --gold:#F0C661;--gold2:#C89B3C;--gold-s:rgba(240,198,97,.12);--gold-l:rgba(240,198,97,.35);
  --red:#FF3D57;--red-s:rgba(255,61,87,.12);--ok:#35E08A;--blue:#4FA8FF;
  --kr:'Pretendard Variable',Pretendard,system-ui,sans-serif;--disp:'Archivo','Pretendard Variable',Pretendard,sans-serif;--num:'Archivo','Pretendard Variable',Pretendard,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--kr);font-size:14px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(900px 500px at 85% -10%,rgba(255,61,87,.10),transparent 60%),radial-gradient(900px 520px at 0% 0%,rgba(240,198,97,.08),transparent 60%),
  repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.012) 46px 47px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:rgba(240,198,97,.3)}

/* 상단 바 */
.top{position:sticky;top:0;z-index:50;background:rgba(6,8,12,.82);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);border-bottom:1px solid var(--line)}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-l),transparent)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;cursor:pointer}
.logo{width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;color:#1A1204;background:linear-gradient(135deg,#FFE29A,var(--gold) 45%,var(--gold2));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.brand-t{min-width:0}
.brand-t b{display:block;font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:-.3px;line-height:1.1}
.brand-t small{display:block;font:600 10.5px var(--num);letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:border-color .2s,background .2s}
.chip:hover{border-color:#3a4558}
.chip img,.chip .ini{width:22px;height:22px;border-radius:50%}
.chip .ini{display:grid;place-items:center;background:#5865F2;color:#fff;font:700 11px var(--num);font-style:normal}
.chip.dc{border-color:rgba(88,101,242,.5);background:rgba(88,101,242,.1);color:#C9CEFF}
.chip.admin{border-color:var(--gold-l);background:var(--gold-s);color:var(--gold);font:700 12px var(--num);letter-spacing:1.5px}

.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 90px}
.view{animation:vin .32s var(--ease) both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fin .22s var(--ease) both}
@keyframes fin{from{opacity:0;transform:translateY(6px)}}

/* 버튼 */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:transform .12s,filter .2s,border-color .2s,background .2s}
.btn:hover:not(:disabled){border-color:#3a4558;filter:brightness(1.12)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{border:0;color:#1A1204;background:linear-gradient(180deg,#FFD978,var(--gold) 50%,var(--gold2));box-shadow:0 6px 22px -8px rgba(240,198,97,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.cut{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);border-radius:0}
.btn.ghost{background:transparent;color:var(--muted);border-color:transparent}
.btn.ghost:hover{color:var(--text)}
.btn.danger{border-color:rgba(255,61,87,.45);color:#FF8A99;background:var(--red-s)}
.btn.sm{height:32px;padding:0 12px;font-size:12px;border-radius:7px}
.btn svg{flex-shrink:0}

/* 배너 (목록) */
.banner{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:4px;padding:34px 28px 26px;margin-bottom:26px;
  background:linear-gradient(110deg,#120F0A 0%,#0C0E14 55%,#140A0E 100%)}
.banner::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(240,198,97,.05) 0 2px,transparent 2px 22px);mask-image:linear-gradient(90deg,transparent 35%,#000 75%);-webkit-mask-image:linear-gradient(90deg,transparent 35%,#000 75%)}
.banner::after{content:'';position:absolute;right:-60px;top:-60px;width:320px;height:320px;background:radial-gradient(circle,rgba(255,61,87,.22),transparent 65%)}
.banner>*{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 11.5px var(--num);letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.eyebrow::before{content:'';width:18px;height:2px;background:var(--gold)}
.disp{font-family:var(--disp);font-weight:700;letter-spacing:-1px;line-height:1.1}
.banner h1{margin:10px 0 8px;font-size:clamp(40px,8vw,68px);background:linear-gradient(180deg,#fff 30%,#C9B48A);-webkit-background-clip:text;background-clip:text;color:transparent}
.banner p{margin:0;color:var(--muted);font-size:14px;max-width:520px}
.bn-row{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-top:22px}
.stats{display:flex;gap:0;border:1px solid var(--line2);background:rgba(0,0,0,.3)}
.stat{padding:10px 18px;min-width:96px}
.stat+.stat{border-left:1px solid var(--line2)}
.stat b{display:block;font:700 28px/1 var(--num);color:var(--text)}
.stat span{display:block;margin-top:4px;font:700 10.5px var(--num);letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.stat.live b{color:var(--red)}
.stat.gold b{color:var(--gold)}

.sec-h{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.sec-h h2{margin:0;font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.3px}
.sec-h .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sec-h em{font:700 11px var(--num);letter-spacing:2px;color:var(--dim);font-style:normal}

/* 대회 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.dcard{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px 18px 16px 22px;cursor:pointer;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.view .dcard,.view .roster,.fade .roster{opacity:0;animation:cin .4s var(--ease) forwards}
@keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc,var(--dim))}
.dcard:hover{transform:translateY(-3px);border-color:var(--gold-l)}
.dcard .nm{font-family:var(--disp);font-weight:700;font-size:22px;line-height:1.25;letter-spacing:-.4px;word-break:keep-all}
.dcard .desc{color:var(--muted);font-size:12.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dcard .foot{display:flex;align-items:flex-end;gap:16px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.kv b{display:block;font:700 24px/1 var(--num)}
.kv span{display:block;font:700 10px var(--num);letter-spacing:1.6px;color:var(--muted);margin-top:3px;text-transform:uppercase}
.kv.gold b{color:var(--gold)}
.dcard .go{margin-left:auto;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--muted);transition:all .25s var(--ease)}
.dcard:hover .go{background:var(--gold);color:#1A1204;border-color:var(--gold);transform:translateX(3px)}
.dtop{display:flex;align-items:center;gap:10px;font:600 12px var(--num);letter-spacing:1px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;font:700 11px var(--kr);border:1px solid;letter-spacing:0}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ready{color:var(--muted);border-color:var(--line2)}
.st.open{color:var(--ok);border-color:rgba(53,224,138,.4);background:rgba(53,224,138,.07)}
.st.running{color:var(--red);border-color:rgba(255,61,87,.5);background:var(--red-s)}
.st.running::before{animation:pulse 1.4s infinite}
.st.ended{color:var(--dim);border-color:var(--line)}
/* 스크림 */
.st.sc-open{color:var(--ok);border-color:rgba(53,224,138,.4);background:rgba(53,224,138,.07)}
.st.sc-closed{color:var(--muted);border-color:var(--line2)}
.st.sc-matched{color:var(--gold);border-color:var(--gold-l);background:var(--gold-s)}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.scard{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px 18px;cursor:pointer;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);transition:transform .25s var(--ease),border-color .25s}
.fade .scard,.view .scard{opacity:0;animation:cin .4s var(--ease) forwards}
.scard:hover{transform:translateY(-3px);border-color:var(--gold-l)}
.scard .nm{font:700 20px/1.25 var(--disp);letter-spacing:-.3px;word-break:keep-all}
.vsrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.vsrow .side{display:flex;align-items:center;gap:9px;min-width:0}
.vsrow .side.r{justify-content:flex-end;text-align:right}
.vsrow .side span{min-width:0}
.vsrow .side b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsrow .side em{display:block;font:700 11px var(--num);font-style:normal;color:var(--gold)}
.vsrow .side.q b{color:var(--muted)}
.vsrow .side.q em{color:var(--dim);font-family:var(--kr)}
.vsx{font:800 15px var(--num);color:var(--red);letter-spacing:1px}
.emb.sm{width:32px;height:32px;font-size:14px}
.emb.qm,.vswait .qm{background:linear-gradient(145deg,#2b3444,#1a212c);color:var(--muted)}
.scard .foot{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.scard .go{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--muted);transition:all .25s var(--ease)}
.scard:hover .go{background:var(--gold);color:#1A1204;border-color:var(--gold)}
.shead{border:1px solid var(--line);background:linear-gradient(110deg,#120F0A,#0C0E14 60%,#140A0E);padding:18px 20px;margin-bottom:16px}
.shead .dtop .btn{margin-left:6px}
.shead h2{margin:8px 0 12px;font-size:clamp(22px,4vw,30px)}
.sinfo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.sinfo div{background:rgba(6,8,12,.7);padding:9px 12px;min-width:0}
.sinfo span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.sinfo b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdesc{margin-top:12px;color:var(--text);font-size:13.5px;white-space:pre-wrap;line-height:1.65}
.memo.warnm{margin-top:12px;border-color:rgba(255,61,87,.3);border-left-color:var(--red);background:rgba(255,61,87,.06)}
.memo.warnm b{color:#FF8A99}
.vsb{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:0;align-items:stretch;margin-bottom:16px}
.vsmid{display:grid;place-items:center}
.vsmid span{font:800 26px var(--num);color:var(--red);text-shadow:0 0 22px rgba(255,61,87,.5)}
.vswait{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:300px;border:1px dashed var(--line2);background:rgba(255,255,255,.01);color:var(--muted);text-align:center;padding:20px}
.vswait .qm{width:56px;height:56px;display:grid;place-items:center;font:800 24px var(--num);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.vswait b{color:var(--text);font-size:15px}
.vswait span{font-size:12.5px}
.roster.sc{opacity:1;animation:none}
.rr.subbed{background:rgba(176,124,240,.06)}
.src.sub{background:rgba(176,124,240,.2);color:#D3B5FA;margin-left:6px;vertical-align:1px}
.pn em.orig{display:block;font-style:normal;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dimt{color:var(--dim)!important;font-weight:500!important}
.applyb{border:1px solid var(--gold-l);background:linear-gradient(90deg,rgba(240,198,97,.07),transparent 70%);padding:14px 16px;margin-bottom:22px}
.ab-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ab-h b{font:700 15px var(--disp)}
.ab-row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ab-solo{flex:1;min-width:260px}
.ab-l{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.lanebtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lb{height:38px;padding:0 12px;border:1px solid rgba(53,224,138,.4);background:rgba(53,224,138,.07);color:#8FF0BE;font-weight:700;font-size:13px;cursor:pointer;border-radius:6px;transition:all .15s}
.lb small{font-size:10.5px;opacity:.75;margin-left:2px}
.lb:hover:not(:disabled){background:rgba(53,224,138,.16)}
.lb.on{background:var(--ok);color:#04150B;border-color:var(--ok)}
.lb:disabled{opacity:.35;cursor:not-allowed}
.rtag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap}
.rtag.ok{color:var(--ok);background:rgba(53,224,138,.1)}
.rtag.bad{color:#FF8A99;background:var(--red-s)}
.roster.warnr{border-color:rgba(255,61,87,.35)}
.empty.sm{padding:22px;font-size:13px}
.lanegrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lcol{border:1px solid var(--line);background:var(--panel);min-width:0}
.lcol-h{display:flex;align-items:baseline;gap:6px;padding:9px 10px;border-bottom:1px solid var(--line)}
.lcol-h b{font:700 13px var(--num);color:var(--gold);letter-spacing:1px}
.lcol-h span{font-size:11px;color:var(--muted)}
.sapp{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;border-bottom:1px solid rgba(255,255,255,.04);background:none;text-align:left;cursor:pointer;transition:background .15s}
.sapp:disabled{cursor:default}
.sapp:hover:not(:disabled){background:rgba(240,198,97,.07)}
.sapp span{flex:1;min-width:0}
.sapp b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sapp small{display:block;font:600 10.5px var(--num);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sapp em{font:700 15px var(--num);font-style:normal}
.sapp.on{background:var(--gold-s);box-shadow:inset 3px 0 0 var(--gold)}
.sapp.me b::after{content:' (나)';color:var(--ok);font-size:11px}
.lempty{padding:12px;color:var(--dim);text-align:center}
.composer{position:sticky;bottom:12px;z-index:20;margin-top:14px;border:1px solid var(--gold-l);background:rgba(14,18,26,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.cc-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.cc-h b{font:700 14px var(--disp)}
.cc-h span{font-size:11.5px;color:var(--muted)}
.ccs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cc{padding:7px 9px;border:1px dashed var(--line2);min-width:0}
.cc.on{border-style:solid;border-color:var(--gold-l);background:var(--gold-s)}
.cc span{display:block;font:700 10px var(--num);color:var(--gold);letter-spacing:1px}
.cc b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc em{font:700 12px var(--num);font-style:normal;color:var(--muted)}
.cc-f{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.cc-f .in.sm{width:220px}
.cc-tot{font:700 11px var(--num);color:var(--muted);letter-spacing:1px}
.cc-tot b{font-size:20px;color:var(--gold);margin-left:4px}
.slot.ro{cursor:default;grid-template-columns:44px minmax(0,1fr) auto 40px}
.slot.ro:hover{border-color:var(--line2);background:var(--panel2)}
.slotw.subd .slot{border-color:rgba(176,124,240,.5);background:rgba(176,124,240,.06)}
.sbtns{display:flex;gap:4px}
.mbox:has(.vsm){max-width:900px}
.vsm{display:grid;grid-template-columns:minmax(0,.8fr) 46px minmax(0,1.2fr);gap:0;align-items:start;margin-bottom:12px}
.vsm-x{align-self:center;text-align:center;font:800 18px var(--num);color:var(--red)}
.vsm-side{border:1px solid var(--line);background:var(--panel2);padding:10px}
.vsm-side.mine{border-color:var(--gold-l)}
.vsm-h{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.vsm-h .emb{background:linear-gradient(145deg,var(--tc),color-mix(in srgb,var(--tc) 70%,#000))}
.vsm-h b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsm-h em{font:700 18px var(--num);font-style:normal;color:var(--gold)}
.vsm-r{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px 2px;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.04)}
.vsm-r span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsm-r em{font:700 13px var(--num);font-style:normal}
.vsm .slots{gap:5px}
.vsrow .emb,.vsm-h .emb{--tc:inherit}
@media (max-width:900px){.lanegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.sinfo{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .scgrid{grid-template-columns:1fr}
  .vsb{grid-template-columns:1fr}
  .vsmid{padding:8px 0}
  .vsswait{min-height:160px}
  .vsm{grid-template-columns:1fr}
  .vsm-x{padding:6px 0}
  .ccs{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .cc{padding:5px}
  .cc b{font-size:11px}
  .cc-f .in.sm{width:100%}
  .slot.ro{grid-template-columns:36px minmax(0,1fr) 34px}
  .slot.ro .sbtns{grid-column:2/4;grid-row:2}
}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,61,87,.6)}50%{box-shadow:0 0 0 5px rgba(255,61,87,0)}}

/* 상세 히어로 */
.back{display:inline-flex;align-items:center;gap:6px;height:30px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:12px;background:none;border:0;padding:0;transition:color .2s,gap .2s}
.back:hover{color:var(--text);gap:9px}
.dhero{position:relative;overflow:hidden;border:1px solid var(--line);padding:26px 26px 0;background:linear-gradient(110deg,#120F0A,#0C0E14 60%,#140A0E)}

.hstats .stat+.stat{border-left:1px solid var(--line)}

/* 탭 */
.tabs{position:relative;display:flex;gap:2px;margin:18px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;height:46px;padding:0 18px;border:0;background:none;color:var(--muted);font:700 16px var(--disp);letter-spacing:-.3px;cursor:pointer;white-space:nowrap;transition:color .2s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--gold)}

.tab.on em{color:var(--gold)}
.tab-ind{position:absolute;bottom:-1px;height:3px;background:var(--gold);box-shadow:0 0 14px rgba(240,198,97,.7);transition:left .3s var(--ease),width .3s var(--ease)}

/* 바 · 안내 */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding:12px 14px;border:1px solid var(--line);background:var(--panel)}
.bar .msg{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);min-width:0}
.bar .msg i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}
.bar .msg.ok i{background:var(--ok)}.bar .msg.wait i{background:var(--gold)}.bar .msg.bad i{background:var(--red)}
.bar .msg b{color:var(--text)}
.note{font-size:12.5px;color:var(--muted)}
.note.warn{color:#FF9AA8}
.empty{padding:56px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);background:rgba(255,255,255,.01)}
.empty b{display:block;color:var(--text);font:700 20px var(--disp);letter-spacing:-.3px;margin-bottom:6px}

/* 로스터 카드 */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.roster{position:relative;background:linear-gradient(170deg,var(--panel2),var(--panel) 60%);border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%)}
.roster::before{content:'';position:absolute;left:0;right:0;top:0;height:76px;background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 22%,transparent),transparent 70%);pointer-events:none}
.roster::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc)}
.roster.pending{border-style:dashed;border-color:rgba(240,198,97,.45)}
.roster.rejected{border-color:rgba(255,61,87,.35)}
.roster.rejected .rbody,.roster.rejected .rhead{opacity:.6}
.rhead{position:relative;display:flex;align-items:center;gap:12px;padding:16px 16px 14px 18px}
.emb{width:46px;height:46px;flex-shrink:0;display:grid;place-items:center;font:800 18px var(--disp);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);
  background:linear-gradient(145deg,color-mix(in srgb,var(--tc) 90%,#fff),color-mix(in srgb,var(--tc) 70%,#000));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.rname{min-width:0;flex:1}
.rname b{display:block;font:700 21px/1.15 var(--disp);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.rname small b{display:inline;font:600 11.5px var(--kr);color:var(--text);letter-spacing:0}
.rname small b.me{color:var(--gold)}
.rtot{text-align:right}
.rtot b{display:block;font:700 32px/0.95 var(--num);color:var(--gold)}
.rtot span{font:700 10px var(--num);letter-spacing:1.2px;color:var(--muted)}
.roster.pending .rhead,.roster.rejected .rhead{padding-top:30px}
.ribbon{position:absolute;left:18px;top:0;z-index:1;height:20px;padding:0 10px;display:flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.3px}
.ribbon.pending{background:var(--gold);color:#1A1204}
.ribbon.rejected{background:var(--red);color:#fff}
.rj{margin:0 16px 10px 18px;padding:8px 10px;font-size:12px;color:#FFB0BB;background:var(--red-s);border-left:2px solid var(--red)}
.rbody{border-top:1px solid var(--line)}
.rr{display:grid;grid-template-columns:40px minmax(0,1fr) 64px 38px;gap:10px;align-items:center;padding:8px 16px 8px 18px}
.rr+.rr{border-top:1px solid rgba(255,255,255,.035)}
.lt{font:700 11px var(--num);letter-spacing:1.5px;color:var(--gold)}
.pn{min-width:0}
.pn b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn b small{color:var(--dim);font-weight:500;font-size:11.5px}
.pn span{display:flex;align-items:center;gap:5px;font:600 11px var(--num);letter-spacing:.5px;color:var(--muted);white-space:nowrap}
.bar5{height:4px;background:rgba(255,255,255,.06);overflow:hidden}
.bar5 i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 60%,transparent),var(--tc));transform-origin:left}
.view .bar5 i,.fade .bar5 i{animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.ps{font:700 17px var(--num);text-align:right}
.src{font:800 9px var(--kr);padding:1px 5px;border-radius:3px;white-space:nowrap;letter-spacing:0}
.src.temp{background:rgba(176,124,240,.16);color:#CBA6F7}
.src.peak{background:var(--gold-s);color:var(--gold)}
.src.cur{background:rgba(79,168,255,.14);color:var(--blue)}
.src.adj{background:rgba(53,224,138,.14);color:var(--ok)}
.rbonus{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 18px;border-top:1px solid var(--line);background:rgba(53,224,138,.05);font-size:12px;color:var(--muted)}
.rbonus span{font-weight:700}
.rbonus b{font:700 15px var(--num);color:var(--ok)}
.rbonus em{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo{padding:12px 14px;border:1px solid rgba(240,198,97,.3);border-left:3px solid var(--gold);background:rgba(240,198,97,.06);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.memo b{display:block;font-size:11.5px;color:var(--gold);margin-bottom:4px}
.memo .btn{display:flex;white-space:nowrap}
.memo.in-card{margin:0;border-width:1px 0 0 0;border-left:0;border-top-color:var(--line);padding:10px 16px 10px 18px;font-size:12.5px}
.slotw .slot{width:100%}
.slot .pn span{flex-wrap:wrap}
.slot .src{flex:none}
.slotw .adjrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 10px 2px 58px}
.adj-l{font-size:11.5px;font-weight:700;color:var(--muted)}
.in.sm{height:32px;width:auto;padding:0 8px;font-size:12.5px}
.in.sm.lp{width:76px}
.slotw.adjd .slot{border-color:rgba(53,224,138,.45)}
.slot s,.ps s{color:var(--dim);font-size:.85em;margin-right:4px}
.bonus{display:grid;grid-template-columns:110px 1fr;gap:8px}
.totbar em{font:600 12px var(--num);font-style:normal;color:var(--muted)}
.rfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);background:rgba(0,0,0,.18)}
.rfoot:empty{display:none}
.rfoot .del{color:var(--dim);padding:0 8px}
.rfoot .del:hover{color:#FF8A99}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;font-size:12px;color:var(--muted)}

.soon{position:relative;overflow:hidden;padding:46px 24px;text-align:center;color:var(--muted);border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel))}
.soon b{display:block;color:var(--text);font:700 24px var(--disp);letter-spacing:-.3px;margin-bottom:8px}
.soon .vs{font:800 60px/1 var(--num);letter-spacing:2px;color:transparent;-webkit-text-stroke:1px var(--gold-l);margin-bottom:10px}

/* 폼 */
.form{display:grid;gap:16px}
.card{border:1px solid var(--line);background:var(--panel);padding:18px}
.card h3{margin:0 0 14px;font:700 16px var(--disp);letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:3px;height:14px;background:var(--gold)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
.f .hint{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.in{width:100%;height:42px;padding:0 12px;border:1px solid var(--line2);background:#0A0E14;font-size:14px;outline:none;border-radius:6px;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--gold-l);box-shadow:0 0 0 3px rgba(240,198,97,.1)}
textarea.in{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 14px;border:1px solid var(--line2);background:var(--panel2);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);border-radius:6px;transition:all .18s}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#1A1204}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.role{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .18s}
.role i{width:9px;height:9px;border-radius:50%}
.role:hover{border-color:#3a4558}
.role.on{border-color:var(--gold);background:var(--gold-s);color:var(--gold)}
.role.on::after{content:'✓';font-size:11px;font-weight:800}
.factions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}

/* 모달 */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,3,6,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.modal.open{opacity:1;visibility:visible;transition:opacity .2s}
.mbox{position:relative;width:100%;max-width:620px;max-height:92vh;overflow:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#121823,var(--panel) 120px);border:1px solid var(--line2);padding:22px;transform:translateY(14px) scale(.985);transition:transform .25s var(--ease)}
.modal.open .mbox{transform:none}
.mbox::before{content:'';position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.mbox h2{margin:0 0 4px;font:700 22px var(--disp);letter-spacing:-.3px}
.mbox .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.mact{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:18px;position:sticky;bottom:-22px;background:var(--panel);padding:12px 0 4px}
.mbody{animation:fin .2s var(--ease)}
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:58px;padding:8px 14px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;text-align:left;border-radius:6px;transition:border-color .18s,background .18s}
.slot:hover{border-color:var(--gold-l);background:#18202c}
.slot.empty{border-style:dashed}
.slot.empty .pn b{color:var(--dim);font-weight:500}
.slot .ps{color:var(--gold);font-size:19px}
.totbar{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;border:1px solid var(--gold-l);background:linear-gradient(90deg,var(--gold-s),transparent)}
.totbar span{font:700 11px var(--num);letter-spacing:1.2px;color:var(--muted)}
.totbar b{font:700 28px/1 var(--num);color:var(--gold)}
.colors{display:flex;gap:7px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border:2px solid transparent;cursor:pointer;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);transition:transform .15s}
.colors button:hover{transform:scale(1.1)}
.colors button.on{outline:2px solid #fff;outline-offset:-5px}
.plist{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto;margin-top:10px}
.pi{display:grid;grid-template-columns:minmax(0,1fr) auto 46px;gap:10px;align-items:center;min-height:52px;padding:7px 12px;border:1px solid transparent;background:var(--panel2);cursor:pointer;text-align:left;border-radius:6px;transition:border-color .15s,background .15s}
.pi:hover:not(:disabled){border-color:var(--gold-l);background:#18202c}
.pi:disabled{opacity:.4;cursor:not-allowed}
.pi .pn small.sub2{display:block;font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanechip{font:700 10px var(--num);letter-spacing:1px;padding:3px 7px;background:rgba(255,255,255,.06);color:var(--muted)}
.lanechip.main{background:var(--gold-s);color:var(--gold)}
.pi .ps{font-size:17px}

/* 스켈레톤 · 토스트 */
.sk{background:linear-gradient(90deg,var(--panel) 0%,#18202B 40%,var(--panel) 80%);background-size:200% 100%;animation:shim 1.2s linear infinite;border:1px solid var(--line)}
@keyframes shim{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:24px;z-index:300;transform:translate(-50%,14px);opacity:0;pointer-events:none;max-width:calc(100% - 32px);padding:11px 18px;background:#161D29;border:1px solid var(--line2);border-left:3px solid var(--gold);font-size:13px;font-weight:600;text-align:center;transition:all .25s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-left-color:var(--red)}
.mini-spin{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--gold);animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:640px){
  .wrap{padding-top:14px}
  .banner{padding:26px 18px 20px}
  .stat{padding:9px 12px;min-width:0;flex:1}
  .stats{width:100%}
  .dhero{padding:20px 18px 0}
  .hstats{margin:16px -18px 0}
  .hstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hstats .stat{padding:10px 18px}
  .hstats .stat:nth-child(3){border-left:0}
  .hstats .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .row2{grid-template-columns:1fr}
  .grid,.rgrid,.sgrid{grid-template-columns:1fr}
  .modal{padding:0;align-items:flex-end}
  .mbox{max-height:94vh;padding:20px 16px;transform:translateY(40px)}
  .mact{bottom:-20px}
  .chip .lbl{display:none}
  .chip{padding:0 8px}
  .rr{grid-template-columns:36px minmax(0,1fr) 44px 34px;gap:8px}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.dcard,.roster{opacity:1}}

<header class="top"><div class="top-in">

    <span class="brand-t"><b>멸망전</b><small id="cname">ROONGING</small></span>

<div class="toast" id="toast"></div>

<script>
(function () {
  var API = 'https://api.roonging.com';
  var REDIRECT = location.origin + '/doom';   // 디스코드 개발자 포털에 등록한 주소와 같아야 해요
  var q = new URLSearchParams(location.search);
  var CID = q.get('cid') || '';
  var LANES = ['top', 'jg', 'mid', 'bot', 'sup'];
  var KO = { top: '탑', jg: '정글', mid: '미드', bot: '원딜', sup: '서폿' };
  var EN = { top: 'TOP', jg: 'JGL', mid: 'MID', bot: 'BOT', sup: 'SUP' };
  var ST = { ready: '준비 중', open: '팀 모집', running: '진행 중', ended: '종료' };
  var SRC = { temp: '임시', peak: '최고', cur: '현재', adj: '보정' };
  var COLORS = ['#4FA8FF', '#FF6B7A', '#3CE085', '#E8C26A', '#B07CF0', '#FF9F43', '#2BD9C5', '#F368E0'];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var ICON_ARROW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var ICON_PLUS = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  // S: 지금 보고 있는 화면 / C: 불러온 데이터 캐시 (화면 전환을 바로 보여주고 뒤에서 새로 고침)
  var S = { view: null, doom: null, teams: [], me: null, isAdmin: false, pool: null, tab: 'teams', meta: null };
  var C = { list: null, listAt: 0, detail: {} };
  var FRESH = 15000;

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function adminToken() { return ls('injeong_session_token') || ls('doom_admin_token') || ''; }
  function dc() { try { return JSON.parse(ls('doom_discord') || 'null'); } catch (e) { return null; } }
  function toast(m, err) { var t = $('toast'); t.textContent = m; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(function () { t.className = 'toast' + (err ? ' err' : ''); }, 2600); }
  async function api(action, body) {
    var d = dc();
    var r = await fetch(API + '/doom', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Session-Token': adminToken() },
      body: JSON.stringify(Object.assign({ action: action, cid: CID, dtoken: d && d.dtoken }, body || {})) });
    var j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok || !j.ok) throw new Error(j.error || ('요청 실패 ' + r.status));
    return j;
  }
  window.go = function (h) { if (location.hash !== h) location.hash = h; else route(); };
  window.closeModal = function () { $('modal').classList.remove('open'); document.body.style.overflow = ''; };
  function openModal(html) {
    var m = $('modal'), was = m.classList.contains('open');
    $('mbox').innerHTML = '<div class="mbody">' + html + '</div>';
    if (!was) { $('mbox').scrollTop = 0; m.classList.add('open'); document.body.style.overflow = 'hidden'; }
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('modal').classList.contains('open')) closeModal(); });

  // ── 디스코드 로그인 ──
  window.dcLogin = async function () {

  window.pickSet = function (did) { if (_tm.lanes[_pickLane] !== did) _tm.adj[_pickLane] = ''; _tm.lanes[_pickLane] = did; drawTeam(); };
  window.curTier = async function (did) {
    var p = poolBy(did); if (!p) return;
    try { await api('refresh-cur', { riotPuuids: [p.riotPuuid] }); var pj = await api('pool'); S.pool = pj.pool; S.table = pj.table || S.table; drawPick(); toast('현재 티어를 불러왔어요'); }
    catch (e) { toast(e.message, true); }
  };
  window.saveTeam = async function () {
    var b = $('tm-save'); if (b) b.disabled = true;
    try {
      await api('team-save', { doomId: S.doom.id, team: { id: _tm.id, name: _tm.name, color: _tm.color, lanes: _tm.lanes, adj: _tm.adj, bonus: Number(_tm.bonus) || 0, bonusNote: _tm.bonusNote, memo: _tm.memo } });
      closeModal(); toast(S.isAdmin ? (_tm.id ? '팀을 저장했어요' : '팀을 만들었어요') : '팀을 신청했어요. 관리자가 수락하면 확정돼요'); S.pool = null; await reloadDetail();
    } catch (e) { if (b) b.disabled = false; toast(e.message, true); }
  };
  window.delTeam = async function () {
    if (!confirm(S.isAdmin ? '"' + _tm.name + '" 팀을 삭제할까요?' : '"' + _tm.name + '" 팀 신청을 취소할까요?')) return;
    try { await api('team-delete', { doomId: S.doom.id, team: { id: _tm.id } }); closeModal(); toast(S.isAdmin ? '팀을 삭제했어요' : '신청을 취소했어요'); S.pool = null; await reloadDetail(); }
    catch (e) { toast(e.message, true); }
  };

  (async function () { await oauthReturn(); renderChips(); route(); })();
})();
</script>
